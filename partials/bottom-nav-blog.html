<div class="bnav-toast" id="bnav-toast" role="status" aria-live="polite"></div>

<style>
  .bnav-toast {
    position: fixed;
    left: 50%;
    bottom: calc(5.2rem + env(safe-area-inset-bottom,0px));
    transform: translateX(-50%) translateY(0.5rem);
    z-index: 10000;
    max-width: calc(100% - 2.5rem);
    padding: 0.6rem 1.1rem;
    background: rgba(20,32,20,0.92);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 50px;
    color: #f5f0e8;
    font-family: 'Lato', sans-serif;
    font-size: 0.78rem;
    letter-spacing: 0.03em;
    text-align: center;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.25s ease, transform 0.25s ease, visibility 0.25s;
  }
  .bnav-toast--widoczny { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
  @media (prefers-reduced-motion: reduce) { .bnav-toast { transition: none; } }
  /* "Udostepnij" to najdluzsza etykieta w pasku - przy 320 px zostawalby
     1 px zapasu, wiec na waskich telefonach lekko ja sciskamy */
  .bnav-share span { white-space: nowrap; }
  @media (max-width: 360px) {
    .bnav-share span { font-size: 0.5rem; letter-spacing: 0; }
  }
</style>

<script>
// Udostepnianie wpisu: natywne okno systemowe, a gdy go nie ma - kopiowanie linku.
function udostepnijStrone(przycisk) {
  var tytul = (document.title || '').split('|')[0].trim();
  var dane = { title: tytul, text: tytul, url: location.href };

  if (navigator.share) {
    navigator.share(dane).catch(function(){ /* Gosc zamknal okno - nic nie robimy */ });
    return;
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(location.href).then(function(){
      pokazToast('Link skopiowany');
    }).catch(function(){
      pokazToast('Nie udalo sie skopiowac linku');
    });
    return;
  }
  pokazToast('Skopiuj adres z paska przegladarki');
}

function pokazToast(tresc) {
  var toast = document.getElementById('bnav-toast');
  if (!toast) return;
  toast.textContent = tresc;
  toast.classList.add('bnav-toast--widoczny');
  clearTimeout(toast._timer);
  toast._timer = setTimeout(function(){
    toast.classList.remove('bnav-toast--widoczny');
  }, 2200);
}
</script>
